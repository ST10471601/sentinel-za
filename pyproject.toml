[project]
name = "sentinel-za"
version = "0.1.0"
description = "Real-time fraud detection platform simulating a South African bank: streaming ingestion, medallion data layers, rules + ML scoring."
readme = "README.md"
license = "MIT"
authors = [{ name = "Daven Pillay" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.11",
    "poethepoet>=0.29",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# ---------------------------------------------------------------------------
# Task runner: `uv run poe <task>` (works the same on Windows and in CI)
# ---------------------------------------------------------------------------
[tool.poe.tasks]
format = { sequence = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }], help = "Auto-format and apply safe lint fixes" }
lint = { sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }], help = "Lint and verify formatting" }
typecheck = { cmd = "mypy", help = "Strict static type checking" }
arch = { cmd = "lint-imports", help = "Enforce architecture boundaries" }
test = { cmd = "pytest", help = "Run all tests with the coverage gate" }
test-unit = { cmd = "pytest -m 'not integration' --no-cov", help = "Run fast unit tests only" }
check = { sequence = ["lint", "typecheck", "arch", "test"], help = "Everything CI runs" }

# ---------------------------------------------------------------------------
# Ruff: linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming conventions
    "D",        # docstrings
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "SIM",      # simplifications
    "C90",      # cyclomatic complexity
    "PTH",      # pathlib over os.path
    "RUF",      # ruff-specific checks
    "TID",      # tidy imports
    "DTZ",      # timezone-aware datetimes only
    "T20",      # no print statements
    "ERA",      # no commented-out code
]
ignore = [
    "D105",     # magic-method docstrings add little value
    "D107",     # __init__ is documented on the class
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# mypy: strict static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=sentinel --cov-report=term-missing"
markers = [
    "integration: touches real I/O (files, databases, brokers); slower",
]

[tool.coverage.run]
branch = true
source = ["sentinel"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# import-linter: architecture boundaries (see docs/architecture.md)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "sentinel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: higher layers may import lower layers, never the reverse"
type = "layers"
layers = [
    "sentinel.cli",
    "sentinel.dashboard",
    "sentinel.scoring",
    "sentinel.ml | sentinel.rules",
    "sentinel.features",
    "sentinel.simulator | sentinel.ingestion",
    "sentinel.broker",
    "sentinel.domain",
    "sentinel.core",
]

[[tool.importlinter.contracts]]
name = "Domain and core stay free of I/O frameworks"
type = "forbidden"
source_modules = ["sentinel.domain", "sentinel.core"]
forbidden_modules = ["typer", "sqlite3", "duckdb", "sqlalchemy", "confluent_kafka", "streamlit"]
allow_indirect_imports = true
